name: CI/CD Pipeline

on:
  push:
    branches:
      - k8s-deployment
  pull_request:
    branches:
      - k8s-deployment

env:
  DOCKER_IMAGE: vimukthirandunu/webhook-delivery-system

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest tests

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get SHA tag
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.sha.outputs.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Copy fresh manifests to Instance 1
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/*"
          target: "~/manifests"
          strip_components: 1

      - name: Substitute image tag and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/manifests
            sed -i "s/IMAGE_TAG_PLACEHOLDER/${{ needs.build.outputs.image_tag }}/" api.yaml
            sed -i "s/IMAGE_TAG_PLACEHOLDER/${{ needs.build.outputs.image_tag }}/" worker.yaml
            sudo kubectl apply -f .
            sudo kubectl rollout status deployment/api --timeout=60s
            sudo kubectl rollout status deployment/worker --timeout=60s