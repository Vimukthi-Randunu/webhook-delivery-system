apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: vimukthirandunu/webhook-delivery-system:IMAGE_TAG_PLACEHOLDER
          command: ["rq", "worker", "--with-scheduler", "--url", "redis://redis-service:6379"]
          env:
            - name: REDIS_URL
              value: "redis://redis-service:6379"
            - name: DATABASE_URL
              value: "postgresql://webhookuser:webhookpass123@10.0.10.236:5432/webhookdb"